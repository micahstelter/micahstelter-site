<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not Found — Micah Stelter</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cormorant Garamond', serif;
      background: #faf9f7; color: #1a1a18;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    .wrap { text-align: center; }
    h1 { font-size: 5rem; font-weight: 300; color: #c8c7c2; }
    p { color: #6b6b67; margin: 0.5rem 0 1.5rem; font-size: 1.1rem; }
    a { font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase; color: #1a1a18; text-decoration: none; border-bottom: 1px solid #c8c7c2; padding-bottom: 2px; }
    a:hover { color: #2a4a3e; border-color: #2a4a3e; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <p>This page doesn't exist.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
