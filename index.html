<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micah Stelter</title>
  <link rel="icon" href="/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #faf9f7;
      color: #1a1a18;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
    }
    .card { max-width: 520px; width: 100%; opacity: 0; animation: appear 1.2s ease forwards; animation-delay: 0.2s; }
    h1 { font-size: clamp(3rem, 8vw, 5.5rem); font-weight: 300; line-height: 1; letter-spacing: -0.01em; }
    h1 em { font-style: italic; color: #2a4a3e; }
    .bio { margin-top: 2rem; font-size: clamp(1rem, 2.5vw, 1.2rem); line-height: 1.7; color: #6b6b67; }
    .contact-link { display: inline-block; margin-top: 2.5rem; font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase; color: #1a1a18; text-decoration: none; border-bottom: 1px solid #c8c7c2; padding-bottom: 2px; transition: border-color 0.2s, color 0.2s; }
    .contact-link:hover { color: #2a4a3e; border-color: #2a4a3e; }

    .tools-section { margin-top: 3rem; opacity: 0; animation: appear 1.2s ease forwards; animation-delay: 0.6s; }
    .tools-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: #a0a09a; margin-bottom: 0.75rem; }
    .tools-grid { display: grid; gap: 0.5rem; }
    .tool-card {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.9rem 1.1rem;
      background: rgba(0,0,0,0.02);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 8px;
      text-decoration: none; color: #1a1a18;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      transition: background 0.2s, border-color 0.2s;
    }
    .tool-card:hover { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.12); }
    .tool-icon { font-size: 1.2rem; width: 1.8rem; text-align: center; flex-shrink: 0; }
    .tool-info h3 { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.1rem; }
    .tool-info p { font-size: 0.72rem; color: #6b6b67; }
    .empty-state {
      padding: 1.2rem; text-align: center; color: #a0a09a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 0.78rem;
      background: rgba(0,0,0,0.02);
      border: 1px dashed rgba(0,0,0,0.08);
      border-radius: 8px;
    }

    @keyframes appear { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Micah<br /><em>Stelter</em></h1>
    <p class="bio">CEO of Paris Brands. Shareholder and builder across Aleph Holdings, Aleph Ventures, and Aleph Capital.</p>

    <div class="tools-section">
      <div class="tools-header">Tools &amp; Dashboards</div>
      <div class="tools-grid" id="tools-grid"></div>
    </div>

    <a class="contact-link" href="mailto:contact@micahstelter.ai">contact@micahstelter.ai</a>
  </div>

  <script>
    fetch('/tools/manifest.json')
      .then(r => r.ok ? r.json() : [])
      .then(tools => {
        const grid = document.getElementById('tools-grid');
        if (!tools.length) {
          grid.innerHTML = '<div class="empty-state">No tools published yet.</div>';
          return;
        }
        grid.innerHTML = tools.map(t => `
          <a class="tool-card" href="/tools/${t.slug}/">
            <div class="tool-icon">${t.icon || '&#9670;'}</div>
            <div class="tool-info">
              <h3>${t.name}</h3>
              <p>${t.description}</p>
            </div>
          </a>
        `).join('');
      })
      .catch(() => {
        document.getElementById('tools-grid').innerHTML =
          '<div class="empty-state">No tools published yet.</div>';
      });
  </script>
</body>
</html>
