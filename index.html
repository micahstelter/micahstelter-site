<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micah Stelter</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #faf9f7;
      color: #1a1a18;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
    }
    .card { max-width: 480px; width: 100%; opacity: 0; animation: appear 1.2s ease forwards; animation-delay: 0.2s; }
    h1 { font-size: clamp(3rem, 8vw, 5.5rem); font-weight: 300; line-height: 1; letter-spacing: -0.01em; }
    h1 em { font-style: italic; color: #2a4a3e; }
    p { margin-top: 2rem; font-size: clamp(1rem, 2.5vw, 1.2rem); line-height: 1.7; color: #6b6b67; }
    a { display: inline-block; margin-top: 2.5rem; font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase; color: #1a1a18; text-decoration: none; border-bottom: 1px solid #c8c7c2; padding-bottom: 2px; transition: border-color 0.2s, color 0.2s; }
    a:hover { color: #2a4a3e; border-color: #2a4a3e; }
    @keyframes appear { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Micah<br /><em>Stelter</em></h1>
    <p>CEO of Paris Brands. Shareholder and builder across Aleph Holdings, Aleph Ventures, and Aleph Capital.</p>
    <a href="mailto:contact@micahstelter.ai">contact@micahstelter.ai</a>
  </div>
</body>
</html>
