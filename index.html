<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micah Stelter</title>
  <link rel="icon" href="/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #faf9f7;
      color: #1a1a18;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 0;
    }

    /* ── Header ── */
    .site-header {
      padding: 2.5rem 2rem 2rem;
      max-width: 960px;
      margin: 0 auto;
      opacity: 0;
      animation: appear 1s ease forwards 0.15s;
    }
    .header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.01em;
    }
    h1 em { font-style: italic; color: #2a4a3e; }
    .header-date {
      font-size: 0.72rem;
      color: #a0a09a;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .header-tagline {
      margin-top: 0.6rem;
      font-size: 0.92rem;
      color: #6b6b67;
      line-height: 1.5;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
    }

    /* ── Dashboard grid ── */
    .dashboard {
      max-width: 960px;
      margin: 0 auto;
      padding: 0.5rem 2rem 3rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      opacity: 0;
      animation: appear 1s ease forwards 0.4s;
    }

    /* ── Section cards ── */
    .section {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 12px;
      padding: 1.5rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .section:hover {
      border-color: rgba(0,0,0,0.1);
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 1.1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .section-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .section-icon.health { background: rgba(42,157,106,0.1); color: #1a7a52; }
    .section-icon.personal { background: rgba(82,100,174,0.1); color: #4a5a9e; }
    .section-icon.work { background: rgba(200,140,40,0.1); color: #8a6a1a; }
    .section-icon.financial { background: rgba(42,74,62,0.1); color: #2a4a3e; }

    .section-title {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #1a1a18;
    }

    /* ── Metric pills inside sections ── */
    .metrics {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .metric {
      background: rgba(0,0,0,0.025);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      flex: 1;
      min-width: 100px;
    }
    .metric-label {
      font-size: 0.62rem;
      color: #a0a09a;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.2rem;
    }
    .metric-value {
      font-size: 1.1rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .metric-value.green { color: #1a7a52; }
    .metric-value.amber { color: #8a6a1a; }
    .metric-value.blue { color: #3a5a9e; }
    .metric-value.muted { color: #6b6b67; }

    /* ── Tool links inside sections ── */
    .tool-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .tool-link {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.6rem 0.75rem;
      background: rgba(0,0,0,0.015);
      border: 1px solid rgba(0,0,0,0.04);
      border-radius: 8px;
      text-decoration: none;
      color: #1a1a18;
      transition: background 0.2s, border-color 0.2s;
    }
    .tool-link:hover {
      background: rgba(0,0,0,0.04);
      border-color: rgba(0,0,0,0.1);
    }
    .tool-link-icon {
      font-size: 0.9rem;
      width: 1.4rem;
      text-align: center;
      flex-shrink: 0;
    }
    .tool-link-info h3 {
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.05rem;
    }
    .tool-link-info p {
      font-size: 0.68rem;
      color: #6b6b67;
    }
    .tool-link .external-badge {
      margin-left: auto;
      font-size: 0.58rem;
      color: #a0a09a;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    /* ── Empty / placeholder state ── */
    .placeholder {
      padding: 0.8rem;
      text-align: center;
      color: #b8b8b2;
      font-size: 0.75rem;
      background: rgba(0,0,0,0.015);
      border: 1px dashed rgba(0,0,0,0.07);
      border-radius: 8px;
    }

    /* ── Footer ── */
    .site-footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 2rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0;
      animation: appear 1s ease forwards 0.6s;
    }
    .footer-link {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #1a1a18;
      text-decoration: none;
      border-bottom: 1px solid #c8c7c2;
      padding-bottom: 1px;
      transition: border-color 0.2s, color 0.2s;
    }
    .footer-link:hover { color: #2a4a3e; border-color: #2a4a3e; }
    .footer-meta {
      font-size: 0.62rem;
      color: #b8b8b2;
      letter-spacing: 0.06em;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 680px) {
      .dashboard { grid-template-columns: 1fr; }
      .site-header { padding: 2rem 1.25rem 1.5rem; }
      .dashboard { padding: 0.5rem 1.25rem 2.5rem; }
      .site-footer { padding: 0 1.25rem 2rem; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-row">
      <h1>Micah <em>Stelter</em></h1>
      <span class="header-date" id="header-date"></span>
    </div>
    <p class="header-tagline">CEO of Paris Brands. Shareholder and builder across Aleph Holdings, Aleph Ventures, and Aleph Capital.</p>
  </header>

  <main class="dashboard" id="dashboard">

    <!-- ── Health & Fitness ── -->
    <div class="section" id="section-health">
      <div class="section-header">
        <div class="section-icon health">&#9829;</div>
        <span class="section-title">Health & Fitness</span>
      </div>
      <div class="metrics" id="health-metrics">
        <!-- Populated by JS or daily agent -->
      </div>
      <div class="tool-list" id="health-tools"></div>
    </div>

    <!-- ── Personal ── -->
    <div class="section" id="section-personal">
      <div class="section-header">
        <div class="section-icon personal">&#9733;</div>
        <span class="section-title">Personal</span>
      </div>
      <div class="metrics" id="personal-metrics"></div>
      <div class="tool-list" id="personal-tools"></div>
    </div>

    <!-- ── Work ── -->
    <div class="section" id="section-work">
      <div class="section-header">
        <div class="section-icon work">&#9670;</div>
        <span class="section-title">Work</span>
      </div>
      <div class="metrics" id="work-metrics"></div>
      <div class="tool-list" id="work-tools"></div>
    </div>

    <!-- ── Financial ── -->
    <div class="section" id="section-financial">
      <div class="section-header">
        <div class="section-icon financial">&#9651;</div>
        <span class="section-title">Financial</span>
      </div>
      <div class="metrics" id="financial-metrics"></div>
      <div class="tool-list" id="financial-tools"></div>
    </div>

  </main>

  <footer class="site-footer">
    <a class="footer-link" href="mailto:contact@micahstelter.ai">contact@micahstelter.ai</a>
    <span class="footer-meta" id="footer-updated"></span>
  </footer>

  <script>
    // ── Date display ──
    const now = new Date();
    const opts = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
    document.getElementById('header-date').textContent = now.toLocaleDateString('en-US', opts);

    // ── Manifest-driven tool population ──
    fetch('/tools/manifest.json')
      .then(r => r.ok ? r.json() : [])
      .then(tools => {
        const buckets = { health: [], personal: [], work: [], financial: [] };

        tools.forEach(t => {
          const cat = t.category || 'work'; // default to work
          if (buckets[cat]) buckets[cat].push(t);
          else buckets.work.push(t);
        });

        Object.entries(buckets).forEach(([cat, items]) => {
          const container = document.getElementById(cat + '-tools');
          if (!container) return;

          if (items.length === 0) {
            container.innerHTML = '<div class="placeholder">No tools yet</div>';
            return;
          }

          container.innerHTML = items.map(t => {
            const isExternal = t.url && t.url.startsWith('http');
            const href = isExternal ? t.url : '/tools/' + t.slug + '/';
            const target = isExternal ? ' target="_blank" rel="noopener"' : '';
            const badge = isExternal ? '<span class="external-badge">External</span>' : '';
            const icon = t.icon || '&#9670;';

            return '<a class="tool-link" href="' + href + '"' + target + '>' +
              '<div class="tool-link-icon">' + icon + '</div>' +
              '<div class="tool-link-info">' +
                '<h3>' + t.name + '</h3>' +
                '<p>' + (t.description || '') + '</p>' +
              '</div>' +
              badge +
            '</a>';
          }).join('');
        });

        // Show metrics from manifest context data if present
        renderMetrics(tools);
      })
      .catch(() => {
        ['health', 'personal', 'work', 'financial'].forEach(cat => {
          const el = document.getElementById(cat + '-tools');
          if (el) el.innerHTML = '<div class="placeholder">No tools yet</div>';
        });
      });

    // ── Context data (updated by daily agent or manual push) ──
    fetch('/tools/context.json')
      .then(r => r.ok ? r.json() : null)
      .then(ctx => {
        if (!ctx) return;

        // Health metrics
        if (ctx.health) {
          const el = document.getElementById('health-metrics');
          const h = ctx.health;
          el.innerHTML = buildMetrics([
            h.calories   ? { label: 'Calories', value: h.calories, cls: 'green' } : null,
            h.protein    ? { label: 'Protein',  value: h.protein,  cls: 'green' } : null,
            h.steps      ? { label: 'Steps',    value: h.steps,    cls: 'muted' } : null,
            h.sleep      ? { label: 'Sleep',    value: h.sleep,    cls: 'blue'  } : null,
          ].filter(Boolean));
        }

        // Personal metrics
        if (ctx.personal) {
          const el = document.getElementById('personal-metrics');
          const p = ctx.personal;
          el.innerHTML = buildMetrics([
            p.events_today ? { label: 'Today',      value: p.events_today + ' events', cls: 'blue'  } : null,
            p.focus        ? { label: 'Focus',       value: p.focus,                    cls: 'muted' } : null,
          ].filter(Boolean));
        }

        // Work metrics
        if (ctx.work) {
          const el = document.getElementById('work-metrics');
          const w = ctx.work;
          el.innerHTML = buildMetrics([
            w.pipeline     ? { label: 'Pipeline',    value: w.pipeline,    cls: 'green' } : null,
            w.open_items   ? { label: 'Open items',  value: w.open_items,  cls: 'amber' } : null,
            w.team_size    ? { label: 'Team',         value: w.team_size,   cls: 'muted' } : null,
          ].filter(Boolean));
        }

        // Financial metrics
        if (ctx.financial) {
          const el = document.getElementById('financial-metrics');
          const f = ctx.financial;
          el.innerHTML = buildMetrics([
            f.ytd_revenue  ? { label: 'YTD Revenue',     value: f.ytd_revenue,  cls: 'green' } : null,
            f.ytd_commission ? { label: 'YTD Commissions', value: f.ytd_commission, cls: 'amber' } : null,
            f.cashflow     ? { label: 'Cash flow',        value: f.cashflow,     cls: 'blue'  } : null,
          ].filter(Boolean));
        }

        // Footer updated timestamp
        if (ctx.updated) {
          document.getElementById('footer-updated').textContent = 'Last refreshed ' + ctx.updated;
        }
      })
      .catch(() => {});

    function buildMetrics(items) {
      if (!items.length) return '';
      return '<div class="metrics">' + items.map(m =>
        '<div class="metric">' +
          '<div class="metric-label">' + m.label + '</div>' +
          '<div class="metric-value ' + m.cls + '">' + m.value + '</div>' +
        '</div>'
      ).join('') + '</div>';
    }

    function renderMetrics(tools) {
      // If no context.json yet, hide empty metric rows
      ['health', 'personal', 'work', 'financial'].forEach(cat => {
        const el = document.getElementById(cat + '-metrics');
        if (el && !el.innerHTML.trim()) el.style.display = 'none';
      });
    }
  </script>
</body>
</html>
