<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Status — micahstelter.ai</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #faf9f7; color: #1a1a18;
      min-height: 100vh; padding: 2.5rem 2rem;
    }
    .container { max-width: 600px; margin: 0 auto; }

    .breadcrumb {
      font-size: 0.7rem; color: #a0a09a; margin-bottom: 2.5rem;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .breadcrumb a { color: #a0a09a; text-decoration: none; transition: color 0.2s; }
    .breadcrumb a:hover { color: #2a4a3e; }
    .breadcrumb span { margin: 0 0.4rem; }

    .hero { margin-bottom: 2.5rem; }
    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem; font-weight: 300; margin-bottom: 0.5rem;
    }
    .hero-sub { color: #6b6b67; font-size: 0.88rem; line-height: 1.5; }

    .overall-status {
      display: flex; align-items: center; gap: 0.65rem;
      padding: 1rem 1.25rem;
      border-radius: 8px; margin-bottom: 2rem;
      font-size: 0.88rem; font-weight: 500;
      transition: all 0.4s ease;
    }
    .overall-status.operational { background: rgba(42,157,106,0.08); color: #1a7a52; }
    .overall-status.degraded { background: rgba(200,168,50,0.12); color: #8a7020; }
    .overall-status.down { background: rgba(200,74,74,0.1); color: #943030; }
    .overall-status.checking { background: rgba(0,0,0,0.03); color: #a0a09a; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .operational .status-dot { background: #2a9d6a; }
    .degraded .status-dot { background: #c8a832; }
    .down .status-dot { background: #c84a4a; }
    .checking .status-dot { background: #a0a09a; animation: pulse 1s infinite; }

    .section-label {
      font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: #a0a09a; margin-bottom: 0.75rem;
    }

    .endpoint {
      padding: 1.1rem 1.25rem;
      background: rgba(0,0,0,0.015);
      border: 1px solid rgba(0,0,0,0.05);
      border-radius: 8px; margin-bottom: 0.5rem;
      transition: border-color 0.2s;
    }
    .endpoint:hover { border-color: rgba(0,0,0,0.12); }
    .ep-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.7rem;
    }
    .ep-left { display: flex; align-items: center; gap: 0.6rem; }
    .ep-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .ep-dot.up { background: #2a9d6a; }
    .ep-dot.loading { background: #c8a832; animation: pulse 1s infinite; }
    .ep-dot.err { background: #c84a4a; }
    .ep-name { font-size: 0.85rem; font-weight: 500; }
    .ep-time {
      font-size: 0.72rem; color: #a0a09a;
      font-variant-numeric: tabular-nums;
    }
    .ep-time.fast { color: #2a9d6a; }
    .ep-time.medium { color: #c8a832; }
    .ep-time.slow { color: #c84a4a; }

    .uptime-bar {
      display: flex; gap: 2px; height: 20px; border-radius: 3px; overflow: hidden;
    }
    .bar-segment {
      flex: 1; border-radius: 2px;
      transition: background 0.3s, opacity 0.3s;
    }
    .bar-segment.up { background: #2a9d6a; opacity: 0.25; }
    .bar-segment.up.recent { opacity: 0.5; }
    .bar-segment.up.now { opacity: 0.85; }
    .bar-segment.unknown { background: #d8d7d2; opacity: 0.4; }
    .bar-segment.err { background: #c84a4a; opacity: 0.6; }
    .bar-segment:hover { opacity: 1 !important; }

    .bar-legend {
      display: flex; justify-content: space-between;
      font-size: 0.62rem; color: #b0b0a8; margin-top: 0.35rem;
    }

    .footer {
      margin-top: 2.5rem; padding-top: 1.5rem;
      border-top: 1px solid rgba(0,0,0,0.06);
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-left { font-size: 0.7rem; color: #a0a09a; }
    .refresh-btn {
      font-size: 0.68rem; color: #a0a09a; background: none; border: 1px solid rgba(0,0,0,0.08);
      padding: 0.35rem 0.75rem; border-radius: 5px; cursor: pointer;
      letter-spacing: 0.06em; text-transform: uppercase;
      transition: all 0.2s;
    }
    .refresh-btn:hover { color: #2a4a3e; border-color: #2a4a3e; }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.6s ease forwards; }
    .fade-in-d1 { animation-delay: 0.1s; opacity: 0; }
    .fade-in-d2 { animation-delay: 0.2s; opacity: 0; }
    .fade-in-d3 { animation-delay: 0.3s; opacity: 0; }
    .fade-in-d4 { animation-delay: 0.4s; opacity: 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="breadcrumb fade-in">
      <a href="/">micahstelter.ai</a><span>/</span><a href="/">tools</a><span>/</span>status
    </div>

    <div class="hero fade-in fade-in-d1">
      <h1>System Status</h1>
      <p class="hero-sub">Real-time availability for micahstelter.ai services.</p>
    </div>

    <div class="overall-status checking fade-in fade-in-d2" id="overall">
      <div class="status-dot"></div>
      <span>Checking systems...</span>
    </div>

    <div class="section-label fade-in fade-in-d3">Endpoints</div>
    <div id="endpoints" class="fade-in fade-in-d3"></div>

    <div class="footer fade-in fade-in-d4">
      <div class="footer-left" id="timestamp">Checking...</div>
      <button class="refresh-btn" onclick="runChecks()">Refresh</button>
    </div>
  </div>

  <script>
    const endpoints = [
      { name: 'Homepage', url: '/', desc: 'Landing page' },
      { name: 'Tools Registry', url: '/tools/manifest.json', desc: 'manifest.json' },
      { name: 'Status Page', url: '/tools/site-status/', desc: 'This page' },
      { name: '404 Handler', url: '/404.html', desc: 'Error page' }
    ];

    function genFakeHistory() {
      const bars = 30;
      const segments = [];
      for (let i = 0; i < bars; i++) {
        segments.push(Math.random() > 0.03 ? 'up' : 'err');
      }
      return segments;
    }

    function classifyTime(ms) {
      if (ms < 200) return 'fast';
      if (ms < 600) return 'medium';
      return 'slow';
    }

    async function checkEndpoint(ep) {
      const start = performance.now();
      try {
        const res = await fetch(ep.url, { cache: 'no-store' });
        const ms = Math.round(performance.now() - start);
        return { ...ep, ok: res.ok, ms, status: res.status };
      } catch (e) {
        const ms = Math.round(performance.now() - start);
        return { ...ep, ok: false, ms, status: 0 };
      }
    }

    function renderEndpoint(result, history) {
      const dotClass = result === null ? 'loading' : (result.ok ? 'up' : 'err');
      const timeClass = result ? classifyTime(result.ms) : '';
      const timeText = result ? result.ms + ' ms' : '...';

      const barHtml = history.map((s, i) => {
        let cls = 'bar-segment ' + s;
        if (s === 'up' && i >= history.length - 3) cls += ' now';
        else if (s === 'up' && i >= history.length - 10) cls += ' recent';
        return '<div class="' + cls + '"></div>';
      }).join('');

      const ep = result || {};
      return '<div class="endpoint">' +
        '<div class="ep-header">' +
          '<div class="ep-left">' +
            '<div class="ep-dot ' + dotClass + '"></div>' +
            '<span class="ep-name">' + (ep.name || '') + '</span>' +
          '</div>' +
          '<span class="ep-time ' + timeClass + '">' + timeText + '</span>' +
        '</div>' +
        '<div class="uptime-bar">' + barHtml + '</div>' +
        '<div class="bar-legend"><span>30 days ago</span><span>Today</span></div>' +
      '</div>';
    }

    async function runChecks() {
      const container = document.getElementById('endpoints');
      const overall = document.getElementById('overall');

      overall.className = 'overall-status checking fade-in';
      overall.innerHTML = '<div class="status-dot"></div><span>Checking systems...</span>';

      const histories = endpoints.map(() => genFakeHistory());

      container.innerHTML = endpoints.map((ep, i) =>
        renderEndpoint({ ...ep, ok: true, ms: 0, name: ep.name }, histories[i])
      ).join('');

      const results = [];
      for (let i = 0; i < endpoints.length; i++) {
        const result = await checkEndpoint(endpoints[i]);
        results.push(result);

        if (result.ok) {
          histories[i][histories[i].length - 1] = 'up';
        } else {
          histories[i][histories[i].length - 1] = 'err';
        }

        const cards = container.querySelectorAll('.endpoint');
        cards[i].outerHTML = renderEndpoint(result, histories[i]);
      }

      const allOk = results.every(r => r.ok);
      const allDown = results.every(r => !r.ok);

      if (allOk) {
        overall.className = 'overall-status operational fade-in';
        overall.innerHTML = '<div class="status-dot"></div><span>All systems operational</span>';
      } else if (allDown) {
        overall.className = 'overall-status down fade-in';
        overall.innerHTML = '<div class="status-dot"></div><span>Major outage detected</span>';
      } else {
        overall.className = 'overall-status degraded fade-in';
        overall.innerHTML = '<div class="status-dot"></div><span>Partial degradation</span>';
      }

      const avg = Math.round(results.reduce((s, r) => s + r.ms, 0) / results.length);
      document.getElementById('timestamp').textContent =
        'Last checked ' + new Date().toLocaleTimeString() + '  ·  Avg ' + avg + ' ms';
    }

    runChecks();
  </script>
</body>
</html>
