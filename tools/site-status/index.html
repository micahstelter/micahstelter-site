<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Status — micahstelter.ai</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #faf9f7; color: #1a1a18;
      min-height: 100vh; padding: 2.5rem;
    }
    .container { max-width: 560px; margin: 0 auto; }
    .breadcrumb { font-size: 0.75rem; color: #a0a09a; margin-bottom: 2rem; letter-spacing: 0.04em; }
    .breadcrumb a { color: #a0a09a; text-decoration: none; }
    .breadcrumb a:hover { color: #2a4a3e; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 300; margin-bottom: 0.4rem; }
    .subtitle { color: #6b6b67; margin-bottom: 2rem; font-size: 0.9rem; }
    .status-card {
      padding: 1rem 1.1rem;
      background: rgba(0,0,0,0.02);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 8px;
      margin-bottom: 0.5rem;
      display: flex; align-items: center; gap: 0.9rem;
    }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #2a9d6a; flex-shrink: 0;
    }
    .dot.loading { background: #c8a832; animation: pulse 1s infinite; }
    .dot.error { background: #c84a4a; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .status-label { font-size: 0.88rem; }
    .status-label small { display: block; color: #a0a09a; font-size: 0.75rem; margin-top: 0.1rem; }
    .timestamp { margin-top: 1.5rem; font-size: 0.7rem; color: #a0a09a; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="breadcrumb"><a href="/">micahstelter.ai</a> / tools / site-status</div>
    <h1>Site Status</h1>
    <p class="subtitle">Live checks for micahstelter.ai infrastructure.</p>
    <div id="checks"></div>
    <div class="timestamp" id="ts"></div>
  </div>
  <script>
    const checks = [
      { name: 'Homepage', url: '/', desc: 'Main landing page' },
      { name: 'Tools Manifest', url: '/tools/manifest.json', desc: 'Tool registry' },
      { name: 'This Page', url: '/tools/site-status/', desc: 'Status tool (self-check)' }
    ];
    async function runChecks() {
      const container = document.getElementById('checks');
      container.innerHTML = checks.map(c =>
        '<div class="status-card"><div class="dot loading"></div><div class="status-label">' + c.name + '<small>' + c.desc + '</small></div></div>'
      ).join('');
      for (let i = 0; i < checks.length; i++) {
        try {
          const res = await fetch(checks[i].url, { method: 'HEAD' });
          const dot = container.children[i].querySelector('.dot');
          dot.classList.remove('loading');
          if (!res.ok) dot.classList.add('error');
        } catch (e) {
          const dot = container.children[i].querySelector('.dot');
          dot.classList.remove('loading');
          dot.classList.add('error');
        }
      }
      document.getElementById('ts').textContent = 'Last checked: ' + new Date().toLocaleString();
    }
    runChecks();
  </script>
</body>
</html>
