<style>

#gate {

}
#gate .gate-card {
  max-width: 360px; width: 100%; text-align: center;

}
#gate h2 {

#gate h2 em { font-style: italic; color: #2a4a3e; }
#gate .gate-sub {

#gate input[type="password"] {

  outline: none; text-align: center; letter-spacing: 0.1em;
  transition: border-color 0.2s;
}
#gate input[type="password"]:focus { border-color: #2a4a3e; }
#gate input[type="password"].error { border-color: #c84a4a; animation: shake 0.4s ease; }
#gate .gate-btn {
  display: inline-block; margin-top: 1rem; padding: 8px 28px;

  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;

}
#gate .gate-btn:hover { border-color: #2a4a3e; color: #2a4a3e; }
#gate .gate-home {
  display: block; margin-top: 1.5rem; font-size: 0.75rem;

}
#gate .gate-home:hover { color: #2a4a3e; }
#app { display: none; }

.container { padding: 20px 24px; max-width: 960px; }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.card { background: #fff; border-radius: 10px; padding: 16px; border: 1px solid #e5e7eb; }

.card .value { font-size: 24px; font-weight: 500; }
.card .value.green { color: #15803d; }
.card .value.orange { color: #E89528; }
.card .value.blue { color: #1d4ed8; }
.card .sub { font-size: 12px; color: #888; margin-top: 2px; }
.section-title { font-size: 13px; font-weight: 500; color: #A47338; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid #E89528; }
.month-select { margin-bottom: 20px; }
.month-select select { padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; background: #fff; cursor: pointer; }
table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #e5e7eb; margin-bottom: 24px; }
th { text-align: left; padding: 10px 14px; font-size: 12px; font-weight: 500; color: #A47338; text-transform: uppercase; letter-spacing: 0.5px; background: #fafafa; border-bottom: 1px solid #e5e7eb; }
th.right { text-align: right; }
td { padding: 10px 14px; font-size: 14px; border-bottom: 1px solid #f3f4f6; }
td.right { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: none; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.badge.approved { background: #dcfce7; color: #166534; }
.badge.pending { background: #FFF8F0; color: #92400e; }
.badge.disputed { background: #fee2e2; color: #991b1b; }
.note-icon { cursor: help; color: #A47338; font-size: 14px; margin-left: 4px; }
.scanning { font-size: 13px; color: #A47338; padding: 8px 14px; background: #FFF8F0; border-radius: 8px; margin-bottom: 16px; display: none; }
.scanning.active { display: block; }
.progress-bar { height: 3px; background: #f0f0f0; border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
.progress-fill { height: 100%; background: #E89528; border-radius: 2px; transition: width 0.3s; }
.trend { margin-bottom: 24px; }
.trend-row { display: flex; gap: 8px; align-items: end; margin-bottom: 4px; }
.trend-bar { background: #E89528; border-radius: 3px 3px 0 0; min-width: 40px; display: flex; align-items: end; justify-content: center; color: #fff; font-size: 10px; font-weight: 500; padding: 4px 2px; }
.trend-label { font-size: 11px; color: #888; text-align: center; min-width: 40px; }
.trend-labels { display: flex; gap: 8px; }
.footer { text-align: center; padding: 16px; font-size: 11px; color: #A47338; }

.back-link:hover { color: #E89528; }

const monthOrder = ['January 2026','February 2026','March 2026','April 2026'];

function fmt(v) {
  if (v < 0) return '-$' + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
  return '$' + v.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
}
function fmtDec(v) {
  if (v < 0) return '-$' + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  return '$' + v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function populateMonthPicker() {
  const picker = document.getElementById('month-picker');
  const allOpt = document.createElement('option');
  allOpt.value = '__all__';
  allOpt.textContent = 'All Months';
  picker.appendChild(allOpt);
  const available = monthOrder.filter(m => ledger.months[m]).reverse();
  available.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    picker.appendChild(opt);
  });
}

function handlePickerChange(val) {
  if (val === '__all__') renderAllMonths();
  else renderMonth(val);
}

function renderAllMonths() {
  const available = monthOrder.filter(m => ledger.months[m]);
  const shortNames = available.map(m => m.split(' ')[0].substring(0, 3));
  const allReps = new Set();
  available.forEach(m => Object.keys(ledger.months[m].reps).forEach(r => allReps.add(r)));

  const rows = [];
  allReps.forEach(name => {
    const monthPayouts = available.map(m => {
      const r = ledger.months[m].reps[name];
      return r ? r.total_payout : null;
    });
    const ytd = monthPayouts.reduce((s, v) => s + (v || 0), 0);
    const pendingCount = available.filter(m => {
      const r = ledger.months[m].reps[name];
      return r && r.approval_status === 'pending';
    }).length;
    rows.push({ name, monthPayouts, ytd, pendingCount });
  });
  rows.sort((a, b) => b.ytd - a.ytd);

  const monthTotals = available.map(m => ledger.months[m].grand_total);
  const grandYtd = monthTotals.reduce((s, v) => s + v, 0);
  const runningTotals = [];
  let running = 0;
  monthTotals.forEach(v => { running += v; runningTotals.push(running); });

  const totalApproved = available.reduce((s, m) => {
    return s + Object.values(ledger.months[m].reps)
      .filter(r => r.approval_status === 'approved')
      .reduce((ss, r) => ss + r.total_payout, 0);
  }, 0);
  const totalPending = grandYtd - totalApproved;
  const pendingRepCount = available.reduce((s, m) => {
    return s + Object.values(ledger.months[m].reps).filter(r => r.approval_status === 'pending').length;
  }, 0);

  document.getElementById('summary-cards').innerHTML =
    '<div class="card"><div class="label">YTD total</div><div class="value blue">' + fmtDec(grandYtd) + '</div><div class="sub">' + available.length + ' months</div></div>' +
    '<div class="card"><div class="label">YTD approved</div><div class="value green">' + fmtDec(totalApproved) + '</div><div class="sub">' + allReps.size + ' reps total</div></div>' +
    '<div class="card"><div class="label">YTD outstanding</div><div class="value orange">' + fmtDec(totalPending) + '</div><div class="sub">' + pendingRepCount + ' approvals pending</div></div>' +
    '<div class="card"><div class="label">Avg monthly</div><div class="value">' + fmtDec(grandYtd / available.length) + '</div><div class="sub">per month</div></div>';

  document.getElementById('progress').style.width = Math.round(totalApproved / grandYtd * 100) + '%';
  document.getElementById('table-title').textContent = 'All months — per rep';

  const thead = document.getElementById('table-head');
  thead.innerHTML = '<tr><th>Rep</th>' +
    shortNames.map(s => '<th class="right">' + s + '</th>').join('') +
    '<th class="right">YTD</th><th></th></tr>';

  const tbody = document.getElementById('rep-table');
  let tbodyHtml = rows.map(row => {
    const cells = row.monthPayouts.map(v => {
      if (v === null) return '<td class="month-cell zero">—</td>';
      if (v === 0) return '<td class="month-cell zero">$0</td>';
      return '<td class="month-cell">' + fmtDec(v) + '</td>';
    }).join('');
    const statusIcon = row.pendingCount > 0
      ? '<span class="badge pending" style="font-size:11px;">' + row.pendingCount + ' pending</span>'
      : '<span style="color:#15803d;font-size:13px;">✓</span>';
    return '<tr><td>' + row.name + '</td>' + cells +
      '<td class="ytd">' + fmtDec(row.ytd) + '</td>' +
      '<td style="text-align:center;">' + statusIcon + '</td></tr>';
  }).join('');

  tbodyHtml += '<tr class="totals-row"><td style="color:#A47338;">Running total</td>' +
    runningTotals.map(v => '<td class="month-cell" style="font-weight:600;">' + fmtDec(v) + '</td>').join('') +
    '<td class="ytd" style="color:#E89528;">' + fmtDec(grandYtd) + '</td><td></td></tr>';

  tbodyHtml += '<tr class="totals-row" style="border-top:none;"><td style="color:#A47338;">Month total</td>' +
    monthTotals.map(v => '<td class="month-cell">' + fmtDec(v) + '</td>').join('') +
    '<td class="ytd">' + fmtDec(grandYtd) + '</td><td></td></tr>';

  tbody.innerHTML = tbodyHtml;
}

function renderTrend() {
  const container = document.getElementById('trend-chart');
  const available = monthOrder.filter(m => ledger.months[m]);
  const maxTotal = Math.max(...available.map(m => ledger.months[m].grand_total));

  let barsHtml = '<div class="trend-row">';
  let labelsHtml = '<div class="trend-labels">';

  available.forEach(m => {
    const data = ledger.months[m];
    const height = Math.max(20, (data.grand_total / maxTotal) * 120);
    const approvedPct = Object.values(data.reps).filter(r => r.approval_status === 'approved').length / Object.keys(data.reps).length;
    const color = approvedPct === 1 ? '#15803d' : '#E89528';
    const label = m.split(' ')[0].substring(0, 3);
    barsHtml += '<div class="trend-bar" style="height:' + height + 'px;background:' + color + ';">' + fmt(data.grand_total) + '</div>';
    labelsHtml += '<div class="trend-label">' + label + '</div>';
  });

  barsHtml += '</div>';
  labelsHtml += '</div>';
  container.innerHTML = barsHtml + labelsHtml;
}

function renderMonth(monthKey) {
  const month = ledger.months[monthKey];
  if (!month) return;

  document.getElementById('table-title').textContent = 'Approval status';
  document.getElementById('table-head').innerHTML = '<tr><th>Rep</th><th class="right">Payout</th><th class="right">Rate</th><th>Status</th><th>Date</th><th></th></tr>';

  const reps = month.reps;
  const entries = Object.entries(reps).sort((a,b) => b[1].total_payout - a[1].total_payout);
  const approved = entries.filter(([,r]) => r.approval_status === 'approved');
  const pending = entries.filter(([,r]) => r.approval_status === 'pending');
  const approvedTotal = approved.reduce((s,[,r]) => s + r.total_payout, 0);
  const pendingTotal = pending.reduce((s,[,r]) => s + r.total_payout, 0);
  const pct = entries.length ? Math.round(approved.length / entries.length * 100) : 0;

  document.getElementById('summary-cards').innerHTML =
    '<div class="card"><div class="label">Grand total</div><div class="value blue">' + fmtDec(month.grand_total) + '</div><div class="sub">' + entries.length + ' reps</div></div>' +
    '<div class="card"><div class="label">Approved</div><div class="value green">' + fmtDec(approvedTotal) + '</div><div class="sub">' + approved.length + ' of ' + entries.length + ' reps</div></div>' +
    '<div class="card"><div class="label">Outstanding</div><div class="value orange">' + fmtDec(pendingTotal) + '</div><div class="sub">' + pending.length + ' reps pending</div></div>' +
    '<div class="card"><div class="label">Approval rate</div><div class="value">' + pct + '%</div><div class="sub">' + (pending.length ? pending.length + ' outstanding' : 'Fully approved') + '</div></div>';

  document.getElementById('progress').style.width = pct + '%';

  const tbody = document.getElementById('rep-table');
  tbody.innerHTML = entries.map(([name, r]) => {
    const statusClass = r.approval_status;
    const statusLabel = r.approval_status.charAt(0).toUpperCase() + r.approval_status.slice(1);
    const dateStr = r.approval_date || '—';
    const rateStr = (r.rate * 100).toFixed(1) + '%';
    const noteHtml = r.note ? '<span class="note-icon" title="' + r.note.replace(/"/g, '&quot;') + '">ℹ</span>' : '';
    return '<tr>' +
      '<td>' + name + '</td>' +
      '<td class="right" style="font-weight:500;">' + fmtDec(r.total_payout) + '</td>' +
      '<td class="right" style="color:#888;">' + rateStr + '</td>' +
      '<td><span class="badge ' + statusClass + '">' + statusLabel + '</span></td>' +
      '<td style="color:#888; font-size:13px;">' + dateStr + '</td>' +
      '<td>' + noteHtml + '</td>' +
    '</tr>';
  }).join('');
}

function initDashboard() {
  populateMonthPicker();
  renderAllMonths();
  renderTrend();
  document.getElementById('last-scan').textContent = 'Data as of: May 16, 2026';
}

// Auto-init (no gate)
initDashboard();
</script>
